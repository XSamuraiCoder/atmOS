
name: Build atmOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CEDEV_VERSION: v15.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the toolchain
        id: cedev-cache
        uses: actions/cache@v4
        with:
          path: ~/CEdev
          key: cedev-${{ env.CEDEV_VERSION }}-linux

      - name: Install the toolchain
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            "https://github.com/CE-Programming/toolchain/releases/download/${CEDEV_VERSION}/CEdev-Linux.tar.gz" \
            -o cedev.tar.gz

          tar -xzf cedev.tar.gz -C "$HOME"

          test -x "$HOME/CEdev/bin/cedev-config"
          test -x "$HOME/CEdev/bin/convfont"

      - name: Set up the environment
        run: |
          echo "CEDEV=$HOME/CEdev" >> "$GITHUB_ENV"
          echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cefont
        run: |
          python -m pip install --upgrade pip
          python -m pip install cefont fonttools brotli
          cefont --help

      - name: Remove stale build output
        run: rm -rf obj bin installer/obj installer/bin

      - name: Normalize line endings
        run: |
          find . -type f \( \
            -name 'Makefile' -o \
            -name '*.mk' -o \
            -name '*.s' -o \
            -name '*.S' -o \
            -name '*.ld' -o \
            -name '*.yaml' \
          \) -not -path './.git/*' \
            -exec sed -i -e 's/\r$//' -e '$a\' {} +

      - name: Download font sources
        run: |
          mkdir -p fonts "dist/extra fonts"

          download_font() {
            local family="$1"
            local filename="$2"

            curl -fLsS \
              -H 'User-Agent: Mozilla/5.0' \
              "https://fonts.googleapis.com/css2?family=${family}:wght@400;700&display=swap" \
              -o "fonts/${filename}.css"

            local url
            url="$(grep -oE 'https://fonts\.gstatic\.com/[^)]+' \
              "fonts/${filename}.css" | head -n 1)"

            if [ -z "$url" ]; then
              echo "Could not find font URL for ${family}" >&2
              exit 1
            fi

            curl -fLsS "$url" -o "fonts/${filename}.woff2"
          }

          download_font "Open+Sans" "sans-serif"
          download_font "Fredoka" "fredoka"
          download_font "BenchNine" "benchmark"
          download_font "Bungee" "bungee"

          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          for source in Path("fonts").glob("*.woff2"):
              target = source.with_suffix(".ttf")
              font = TTFont(source)
              font.flavor = None
              font.save(target)
              print(f"Converted {source} -> {target}")
          PY

      - name: Build FontLibC fonts
        run: |
          mkdir -p "dist/extra fonts"

          cefont build fonts/sans-serif.ttf --name SANSERIF
          cefont build fonts/fredoka.ttf --name FREDOKA
          cefont build fonts/benchmark.ttf --name BENCHMAR
          cefont build fonts/bungee.ttf --name BUNGEE

          for name in SANSERIF FREDOKA BENCHMAR BUNGEE; do
            file="$(find . -maxdepth 1 -type f \
              -iname "${name}.8xv" -print -quit)"

            if [ -z "$file" ]; then
              echo "Missing generated font AppVar: ${name}.8xv" >&2
              exit 1
            fi

            cp "$file" "dist/extra fonts/"
          done

          ls -lh "dist/extra fonts/"

      - name: Build app, installer, and libraries
        run: make package

      - name: Collect build outputs
        run: |
          cp bin/atmOS.*.8xv dist/
          cp bin/INSTALL.8xp bin/clibs.8xg readme.txt dist/

          ls -lh dist/
          ls -lh "dist/extra fonts/"

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../atmOS.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmOS
          path: dist/
          if-no-files-found: error
          compression-level: 9

      - name: Update nightly release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true

          gh release create nightly atmOS.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "atmOS (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA}. Unzip and send the files to the calculator."
